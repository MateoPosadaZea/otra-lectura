<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$titulo</title>
$meta
<link rel="preload" href="${raiz}fuentes/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="${raiz}fuentes/unifraktur.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="${raiz}estilo.css">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="saltar" href="#contenido">Ir al contenido</a>
<header class="sitio">
<div class="marca">
<a class="cabezote" href="${raiz}index.html">Otra Lectura</a>
</div>
<div class="barra">
<nav class="principal" aria-label="Secciones">
$menu
</nav>
<details class="menu">
<summary><span aria-hidden="true">☰</span> Secciones</summary>
<nav aria-label="Secciones">
$menu
</nav>
</details>
<button class="tema" type="button" hidden>Oscuro</button>
</div>
</header>
<main id="contenido">
$contenido
</main>
<aside class="notas" aria-label="Notas para ajustar el sitio">
<details open>
<summary>Notas <span class="notas-cuenta" hidden></span></summary>
<form class="notas-form" method="post" action="/api/ajuste">
<input type="hidden" name="pagina" value="$nota_pagina">
<input type="hidden" name="titulo" value="$nota_titulo">
<p class="notas-ayuda">Correcciones, ideas o comentarios mientras lee. Seleccione un fragmento del texto para citarlo.</p>
<p class="notas-cita" hidden><span></span> <button type="button" aria-label="Quitar la cita">×</button></p>
<textarea name="texto" rows="4" maxlength="4000" aria-label="Nota" placeholder="Escriba una nota…"></textarea>
<button type="button" class="notas-agregar" hidden>Agregar nota</button>
<ol class="notas-lista" hidden></ol>
<div class="notas-envio">
<label>Nombre <input name="quien" autocomplete="name"></label>
<label>Clave <input name="clave" type="password" autocomplete="current-password" required></label>
<label class="notas-recordar" hidden><input type="checkbox" checked> Recordar en este dispositivo</label>
<button type="submit" class="notas-enviar">Enviar</button>
</div>
<p class="notas-estado" role="status" aria-live="polite" hidden></p>
</form>
</details>
</aside>
<footer class="sitio">
<p><a class="cabezote" href="${raiz}index.html">Otra Lectura</a></p>
<p>Una mirada pragmática para informarse y participar.</p>
<p class="pie-enlaces"><a href="${raiz}index.html">Todas las ediciones</a> · <a href="${raiz}candidatas.html">Candidatas</a></p>
</footer>
<script>
/* Cambio claro/oscuro. Sin elección guardada, sigue al sistema. */
(function () {
  var boton = document.querySelector(".tema");
  var raiz = document.documentElement;
  var sistema = matchMedia("(prefers-color-scheme: dark)");
  function actual() { return raiz.dataset.theme || (sistema.matches ? "dark" : "light"); }
  function pintar() {
    var oscuro = actual() === "dark";
    boton.textContent = oscuro ? "◑ Claro" : "◐ Oscuro";
    boton.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
  }
  boton.hidden = false;
  pintar();
  boton.addEventListener("click", function () {
    var nuevo = actual() === "dark" ? "light" : "dark";
    raiz.dataset.theme = nuevo;
    try { localStorage.setItem("tema", nuevo); } catch (e) {}
    pintar();
  });
  sistema.addEventListener("change", pintar);
})();
/* Cierra el menú de secciones al hacer clic fuera o con Escape. */
(function () {
  var menu = document.querySelector("details.menu");
  if (!menu) return;
  document.addEventListener("click", function (ev) { if (!menu.contains(ev.target)) menu.open = false; });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") menu.open = false; });
})();
</script>
<script>
/* Notas: se acumulan en este navegador (incluso entre páginas) y se envían
   todas juntas; nombre y clave se recuerdan si el lector lo permite. */
(function () {
  var panel = document.querySelector(".notas");
  if (!panel) return;
  var detalles = panel.querySelector("details");
  var form = panel.querySelector("form");
  var texto = form.querySelector("textarea");
  var lista = panel.querySelector(".notas-lista");
  var cuenta = panel.querySelector(".notas-cuenta");
  var citaBox = panel.querySelector(".notas-cita");
  var agregar = panel.querySelector(".notas-agregar");
  var enviar = panel.querySelector(".notas-enviar");
  var estado = panel.querySelector(".notas-estado");
  var recordar = panel.querySelector(".notas-recordar");
  var quien = form.elements.quien, clave = form.elements.clave;
  var aqui = { pagina: form.elements.pagina.value, titulo: form.elements.titulo.value };
  var cita = "";

  function leer(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function borrar(k) { try { localStorage.removeItem(k); } catch (e) {} }
  var notas = leer("notas", []);

  quien.value = leer("notas-quien", "");
  clave.value = leer("notas-clave", "");
  agregar.hidden = false;
  recordar.hidden = false;
  if (matchMedia("(max-width: 1239px)").matches) detalles.open = false;

  function pintar() {
    lista.innerHTML = "";
    notas.forEach(function (n, i) {
      var li = document.createElement("li");
      if (n.cita) {
        var q = document.createElement("q");
        q.textContent = n.cita.length > 90 ? n.cita.slice(0, 90) + "…" : n.cita;
        li.appendChild(q);
      }
      var t = document.createElement("span");
      t.textContent = n.texto.length > 160 ? n.texto.slice(0, 160) + "…" : n.texto;
      li.appendChild(t);
      if (n.pagina !== aqui.pagina) {
        var p = document.createElement("small");
        p.textContent = n.titulo;
        li.appendChild(p);
      }
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", "Quitar esta nota");
      x.addEventListener("click", function () { notas.splice(i, 1); guardar("notas", notas); pintar(); });
      li.appendChild(x);
      lista.appendChild(li);
    });
    lista.hidden = !notas.length;
    cuenta.hidden = !notas.length;
    cuenta.textContent = notas.length;
    enviar.textContent = notas.length > 1 ? "Enviar " + notas.length + " notas" : "Enviar";
  }

  function pintarCita() {
    citaBox.hidden = !cita;
    citaBox.querySelector("span").textContent = cita ? "Citando: «" + (cita.length > 120 ? cita.slice(0, 120) + "…" : cita) + "»" : "";
  }
  citaBox.querySelector("button").addEventListener("click", function () { cita = ""; pintarCita(); });

  // Guarda el último fragmento seleccionado dentro del texto de la página.
  document.addEventListener("selectionchange", function () {
    var sel = document.getSelection();
    var s = sel ? String(sel).trim() : "";
    if (s && sel.anchorNode && document.getElementById("contenido").contains(sel.anchorNode)) {
      cita = s.replace(/\s+/g, " ").slice(0, 600);
      pintarCita();
    }
  });

  agregar.addEventListener("click", function () {
    var v = texto.value.trim();
    if (!v) { texto.focus(); return; }
    notas.push({ texto: v, cita: cita, pagina: aqui.pagina, titulo: aqui.titulo });
    guardar("notas", notas);
    texto.value = "";
    cita = "";
    pintarCita();
    pintar();
    texto.focus();
  });

  function mostrar(msg, ok) {
    estado.textContent = msg;
    estado.className = "notas-estado " + (ok ? "ok" : "error");
    estado.hidden = false;
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var tanda = notas.slice();
    if (texto.value.trim()) tanda.push({ texto: texto.value.trim(), cita: cita, pagina: aqui.pagina, titulo: aqui.titulo });
    if (!tanda.length) { mostrar("Escriba al menos una nota.", false); return; }
    var datos = new FormData();
    datos.append("pagina", aqui.pagina);
    datos.append("titulo", aqui.titulo);
    datos.append("quien", quien.value);
    datos.append("clave", clave.value);
    datos.append("notas", JSON.stringify(tanda));
    enviar.disabled = true;
    enviar.textContent = "Enviando…";
    fetch(form.action, { method: "POST", body: datos, headers: { Accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        mostrar(d.titulo + ". " + d.mensaje, d.ok);
        if (!d.ok) return;
        notas = [];
        borrar("notas");
        texto.value = "";
        cita = "";
        pintarCita();
        if (recordar.querySelector("input").checked) {
          guardar("notas-quien", quien.value);
          guardar("notas-clave", clave.value);
        } else {
          borrar("notas-clave");
        }
      })
      .catch(function () { mostrar("No se pudo enviar. Las notas siguen guardadas; inténtelo de nuevo.", false); })
      .then(function () { enviar.disabled = false; pintar(); });
  });

  pintar();
})();
</script>
</body>
</html>
