<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$titulo</title>
<meta name="description" content="$descripcion">
$robots
<link rel="preload" href="${raiz}fuentes/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="${raiz}fuentes/unifraktur.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="${raiz}estilo.css">
<script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="saltar" href="#contenido">Ir al contenido</a>
<header class="sitio">
<p class="lado">Radar de fricciones</p>
<a class="cabezote" href="${raiz}index.html">Otra Lectura</a>
<div class="lado-der">
<p class="lado">Colombia · mundo</p>
<button class="tema" type="button" hidden>Oscuro</button>
</div>
</header>
<main id="contenido">
$contenido
</main>
<footer class="sitio">
<p><a class="cabezote" href="${raiz}index.html">Otra Lectura</a></p>
<p>Qué se traba, quién lo está resolviendo y con qué contrapeso.</p>
<p class="pie-enlaces"><a href="${raiz}index.html">Todas las ediciones</a> · <a href="${raiz}candidatas.html">Candidatas</a></p>
</footer>
<script>
/* Cambio claro/oscuro. Sin elección guardada, sigue al sistema. */
(function () {
  var boton = document.querySelector(".tema");
  var raiz = document.documentElement;
  var sistema = matchMedia("(prefers-color-scheme: dark)");
  function actual() { return raiz.dataset.theme || (sistema.matches ? "dark" : "light"); }
  function pintar() {
    var oscuro = actual() === "dark";
    boton.textContent = oscuro ? "◑ Claro" : "◐ Oscuro";
    boton.setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
  }
  boton.hidden = false;
  pintar();
  boton.addEventListener("click", function () {
    var nuevo = actual() === "dark" ? "light" : "dark";
    raiz.dataset.theme = nuevo;
    try { localStorage.setItem("tema", nuevo); } catch (e) {}
    pintar();
  });
  sistema.addEventListener("change", pintar);
})();
</script>
<script>
/* Envía el ajuste sin salir de la página y muestra la respuesta en el recuadro. */
document.querySelectorAll(".ajuste form").forEach(function (form) {
  var estado = form.querySelector(".ajuste-estado");
  var boton = form.querySelector("button");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    boton.disabled = true;
    boton.textContent = "Enviando…";
    fetch(form.action, { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        estado.textContent = d.titulo + ". " + d.mensaje;
        estado.className = "ajuste-estado " + (d.ok ? "ok" : "error");
        if (d.ok) form.querySelector("textarea").value = "";
      })
      .catch(function () {
        estado.textContent = "No se pudo enviar. Revise la conexión e inténtelo de nuevo.";
        estado.className = "ajuste-estado error";
      })
      .then(function () {
        estado.hidden = false;
        boton.disabled = false;
        boton.textContent = "Enviar ajuste";
      });
  });
});
</script>
</body>
</html>
